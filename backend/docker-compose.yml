services:
  api:
    build:
      context: .
    command: uvicorn riskagent.api.main:app --host 0.0.0.0 --port 8000
    environment:
      ANALYSIS_EXECUTION_MODE: rq
      ANALYSIS_QUEUE_NAME: analysis
      AGENT_RUNTIME_DATA_DIR: /app/data/agent_runtime
      A2A_PUBLIC_BASE_URL: ${A2A_PUBLIC_BASE_URL:-http://localhost:8000}
      LANGGRAPH_CHECKPOINT_BACKEND: postgres
      CORS_ALLOW_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174
      DATABASE_URL: postgresql+psycopg://prospect_alpha:prospect_alpha@postgres:5432/prospect_alpha
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: root
      MINIO_SECRET_KEY: root1234
      MINIO_SECURE: "0"
      OBJECT_STORE_PROVIDER: minio
      OBJECT_STORE_BUCKET: prospect-alpha
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - agent_runtime_data:/app/data/agent_runtime
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: .
    command: prospect-alpha-worker
    environment:
      ANALYSIS_EXECUTION_MODE: rq
      ANALYSIS_QUEUE_NAME: analysis
      AGENT_RUNTIME_DATA_DIR: /app/data/agent_runtime
      A2A_PUBLIC_BASE_URL: ${A2A_PUBLIC_BASE_URL:-http://localhost:8000}
      LANGGRAPH_CHECKPOINT_BACKEND: postgres
      DATABASE_URL: postgresql+psycopg://prospect_alpha:prospect_alpha@postgres:5432/prospect_alpha
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: root
      MINIO_SECRET_KEY: root1234
      MINIO_SECURE: "0"
      OBJECT_STORE_PROVIDER: minio
      OBJECT_STORE_BUCKET: prospect-alpha
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
    volumes:
      - agent_runtime_data:/app/data/agent_runtime
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    image: prospect-alpha-postgres-pgvector-jieba:pg16
    environment:
      POSTGRES_DB: prospect_alpha
      POSTGRES_USER: prospect_alpha
      POSTGRES_PASSWORD: prospect_alpha
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prospect_alpha -d prospect_alpha"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: root1234
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  agent_runtime_data:
  postgres_data:
  minio_data:
