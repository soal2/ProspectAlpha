services:
  api:
    build:
      context: .
    command: uvicorn riskagent.api.main:app --host 0.0.0.0 --port 8000
    environment:
      ANALYSIS_EXECUTION_MODE: rq
      ANALYSIS_QUEUE_NAME: analysis
      CORS_ALLOW_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174
      DATABASE_URL: postgresql+psycopg://prospect_alpha:prospect_alpha@postgres:5432/prospect_alpha
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      VECTOR_STORE_PROVIDER: qdrant
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: root
      MINIO_SECRET_KEY: root1234
      MINIO_SECURE: "0"
      OBJECT_STORE_PROVIDER: minio
      OBJECT_STORE_BUCKET: prospect-alpha
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: .
    command: prospect-alpha-worker
    environment:
      ANALYSIS_EXECUTION_MODE: rq
      ANALYSIS_QUEUE_NAME: analysis
      DATABASE_URL: postgresql+psycopg://prospect_alpha:prospect_alpha@postgres:5432/prospect_alpha
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      VECTOR_STORE_PROVIDER: qdrant
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: root
      MINIO_SECRET_KEY: root
      MINIO_SECURE: "0"
      OBJECT_STORE_PROVIDER: minio
      OBJECT_STORE_BUCKET: prospect-alpha
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_started

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: prospect_alpha
      POSTGRES_USER: prospect_alpha
      POSTGRES_PASSWORD: prospect_alpha
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prospect_alpha -d prospect_alpha"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.12.1
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: root1234
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  qdrant_data:
  minio_data:
