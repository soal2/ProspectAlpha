[project]
name = "prospect-alpha-backend"
version = "0.1.0"
description = "Backend skeleton for the HK-IPO RiskAgent pipeline."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.8.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]
pipeline = [
  # Future dependencies: PostgreSQL, Qdrant, Celery/RQ, LangGraph, PyMuPDF,
  # pdfplumber, pandas, LightGBM, Jinja2.
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
