[project]
name = "prospect-alpha-backend"
version = "0.1.0"
description = "Backend skeleton for the HK-IPO RiskAgent pipeline."
requires-python = ">=3.11"
dependencies = [
  "dashscope>=1.20.0",
  "a2a-sdk[http-server]>=1.1,<2",
  "fastapi>=0.115.0",
  "httpx>=0.27",
  "langgraph>=1.2.0",
  "langgraph-checkpoint-postgres>=3.1,<4",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "minio>=7.2.0",
  "openai>=1.40.0",
  "PyMuPDF>=1.24.0",
  "pydantic>=2.8.0",
  "psycopg[binary]>=3.2.0",
  "PyYAML>=6.0.0",
  "python-multipart>=0.0.9",
  "redis>=5.0.0",
  "rq>=1.16.0",
  "SQLAlchemy>=2.0.0",
  "tenacity>=8.2.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]
pipeline = [
  "alembic>=1.13.0",
  "mineru",
  "ftfy>=6.3.0",
  "pdfplumber>=0.11.0",
  "pyclipper>=1.4.0",
  "shapely>=2.1.0",
  "torch>=2.13.0",
  "torchvision>=0.28.0",
  "transformers>=4.57.3,<5.0.0",
]

[project.scripts]
prospect-alpha-worker = "riskagent.workers.rq_worker:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.vercel]
entrypoint = "main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
