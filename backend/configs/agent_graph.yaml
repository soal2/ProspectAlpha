# Documentation and observability manifest for the dynamic collaboration
# contract. Runtime values are implemented in the Python services; this file is
# intentionally not an execution driver or a source of fixed expert edges.
graph_id: hk_ipo_risk_dynamic_team_v2
mode: dynamic_strategist_langgraph
strategist: orchestrator

expert_catalog:
  source: agent_spec_repository
  availability_semantics: catalog_membership
  system_prompt_variable: AVAILABLE_EXPERTS_JSON
  agent_card_url_template: /a2a/{agent_name}/.well-known/agent-card.json

strategy:
  structured_output: StrategyDecision
  require_validated_output: true
  minimum_experts: 1
  manual_selection_interrupt: awaiting_expert_selection
  max_replacements_per_module: 2

langgraph:
  # These are protocol lifecycle stages, not hard-coded expert nodes or edges.
  lifecycle:
    - strategy_plan
    - validate_strategy
    - spawn_experts
    - await_expert_idle
    - dispatch_assignments
    - collect_module_results
    - expert_debate
    - verify_evidence
    - synthesize_report
    - shutdown_team
  dynamic_fan_out: true
  thread_id_source: run_id
  checkpointer:
    backend_env: LANGGRAPH_CHECKPOINT_BACKEND
    backend_values:
      - sqlite
      - postgres
    sqlite_path: ./data/agent_runtime/langgraph_checkpoints.sqlite
    postgres_url_env: DATABASE_URL

expert_debate:
  # Sits between risk_identification and cross_validation in PIPELINE_STAGES.
  # Two fixed rounds of peer critique + finding revision, then L3 red-team
  # arbiter (周慎言 / zhou_shenyan_redteam_agent) issues an ArbiterRuling.
  # When the arbiter rules request_supplement with flagged findings, an
  # optional round 3 (focused debate) is triggered for contested findings only.
  position: between_risk_identification_and_cross_validation
  max_rounds: 3   # 2 fixed + 1 conditional focused debate
  rounds:
    - round: 1
      kind: critique
      round_type: critique
      shape: each_expert_critiques_each_peer_findings
      output: PeerCritique
    - round: 2
      kind: revision
      round_type: revision
      shape: each_expert_revises_own_findings_based_on_critiques_received
      output: FindingRevision
    - round: 3
      kind: focused_debate
      round_type: focused_debate
      trigger: arbiter_decision == "request_supplement" and flagged_finding_ids non-empty
      shape: targeted_exchange_on_contested_findings_only
      participants: flagging_experts + flagged_experts
      output: PeerCritique + FindingRevision (focused)
  arbiter:
    agent_name: zhou_shenyan_redteam_agent
    layer: L3
    role_zh: 红队 / 质量总检
    output: ArbiterRuling
    decisions:
      - proceed               # 进入 cross_validation
      - request_supplement    # 要求补充证据（最多 1 次循环后强制 proceed）
      - escalate_human        # 标记 debate_needs_manual，转入人工复核
  per_round_peer_budget: fresh_task_per_round   # 避免 MAX_PEER_ROUNDS_PER_TASK=3 触顶
  sse_events:
    - debate_round_started
    - peer_critique_sent
    - debate_round_completed
    - expert_revised
    - evidence_supplement_requested
    - debate_arbiter_ruling
    - debate_completed
  persistence: analysis_runs.debate_history (JSON)

a2a:
  protocol_version: "1.0"
  binding: JSONRPC
  endpoint_template: /a2a/{agent_name}
  public_base_url_env: A2A_PUBLIC_BASE_URL
  send_timeout_seconds_env: A2A_SEND_TIMEOUT_SECONDS
  require_version_header: true
  streaming: false
  task_id_semantics: server_generated_globally_unique
  module_id_location: assignment_metadata
  data_model:
    - AgentCard
    - Task
    - Message
    - Artifact

mailbox:
  format: jsonl
  root_env: AGENT_RUNTIME_DATA_DIR
  root_default: ./data/agent_runtime
  poll_interval_ms: 500
  file_mode: "0600"
  directory_mode: "0700"
  delivery: at_least_once
  deduplicate_by: message_id
  atomic_claim: true
  claim_lease_seconds: 300
  renew_claim_while_working: true
  request_correlation_field: request_id
  response_correlation_fields:
    - sender
    - in_reply_to
  dead_letter_enabled: true

expert_runtime:
  thread_per_expert: true
  daemon_threads: false
  start_timeout_seconds: 10
  task_timeout_seconds: 300
  shutdown_timeout_seconds: 10
  max_peer_rounds_per_task: 3
  initial_state: idle

reporting:
  verifier_required: true
  require_all_modules: true
  final_synthesizer: orchestrator
  cross_modal_resonance: true   # 基本面 × 市场情绪 跨模态共振分析

# 新增专家 Agent 注册（ESG 与宏观经济）
# 实际运行时由 seed_data.AGENT_SPECS 驱动，此处仅作架构文档。
registered_experts:
  - id: "esg_agent"
    name: "林若清"
    role: "ESG评估专家"
    prompt_file: "esg_agent.md"
    tier: "L1"

  - id: "macro_economy_agent"
    name: "赵宏远"
    role: "宏观经济分析专家"
    prompt_file: "macro_economy_agent.md"
    tier: "L2"
