# Feature Rules for HK IPO Risk Analysis
# Maps risk rules to computable features from prospectus data
# Version: 1.0
# Total features: 59 across 6 groups
# Covers all 164 risk rules (HKIPO-001 to HKIPO-164)

feature_groups:
  # ============================================================
  # Group 1: Financial Features (20 features)
  # ============================================================
  - id: "FG_FINANCIAL"
    name: "财务特征组"
    description: "从招股书财务报表中提取的定量特征，覆盖盈利能力、偿债能力、营运能力、现金流、盈利质量、成长能力和资本结构"
    features:
      # --- Profitability ---
      - id: "F001"
        name: "毛利率"
        name_en: "gross_profit_margin"
        source_sections: ["综合损益表", "财务资料", "管理层讨论与分析"]
        source_keywords: ["毛利率", "gross profit margin", "毛利", "营业成本"]
        calculation: "(营业收入 - 营业成本) / 营业收入 × 100%"
        data_type: "float"
        unit: "percent"
        thresholds:
          - condition: "< 10%"
            risk_level: "high"
          - condition: "10% - 20%"
            risk_level: "medium"
          - condition: "20% - 40%"
            risk_level: "low"
          - condition: "> 40%"
            risk_level: "low"
            note: "需结合行业特征判断"
        mapped_rules: ["HKIPO-001"]

      - id: "F002"
        name: "净利率"
        name_en: "net_profit_margin"
        source_sections: ["综合损益表", "管理层讨论与分析"]
        source_keywords: ["净利率", "net profit margin", "净利润"]
        calculation: "净利润 / 营业收入 × 100%"
        data_type: "float"
        unit: "percent"
        thresholds:
          - condition: "< 0%"
            risk_level: "high"
          - condition: "0% - 5%"
            risk_level: "medium"
          - condition: "5% - 15%"
            risk_level: "low"
          - condition: "> 15%"
            risk_level: "low"
            note: "需与行业可比公司中位数对比"
        mapped_rules: ["HKIPO-002"]

      - id: "F003"
        name: "净资产收益率(ROE)"
        name_en: "return_on_equity"
        source_sections: ["综合损益表", "资产负债表", "财务资料"]
        source_keywords: ["ROE", "净资产收益率", "return on equity"]
        calculation: "归母净利润 / 平均归母净资产 × 100%"
        data_type: "float"
        unit: "percent"
        thresholds:
          - condition: "< 5%"
            risk_level: "high"
          - condition: "5% - 8%"
            risk_level: "medium"
          - condition: "8% - 15%"
            risk_level: "low"
          - condition: "> 15%"
            risk_level: "low"
        mapped_rules: ["HKIPO-003"]

      - id: "F004"
        name: "总资产收益率(ROA)"
        name_en: "return_on_assets"
        source_sections: ["综合损益表", "资产负债表", "财务资料"]
        source_keywords: ["ROA", "总资产收益率", "return on assets"]
        calculation: "净利润 / 平均总资产 × 100%"
        data_type: "float"
        unit: "percent"
        thresholds:
          - condition: "< 3%"
            risk_level: "high"
          - condition: "3% - 5%"
            risk_level: "medium"
          - condition: "5% - 10%"
            risk_level: "low"
          - condition: "> 10%"
            risk_level: "low"
        mapped_rules: ["HKIPO-004"]

      - id: "F005"
        name: "营业利润率"
        name_en: "operating_profit_margin"
        source_sections: ["综合损益表", "财务资料"]
        source_keywords: ["营业利润率", "operating profit", "营业利润"]
        calculation: "营业利润 / 营业收入 × 100%"
        data_type: "float"
        unit: "percent"
        thresholds:
          - condition: "< 0% 且连续2期以上"
            risk_level: "high"
          - condition: "< 0%"
            risk_level: "high"
          - condition: "0% - 10%"
            risk_level: "medium"
          - condition: "> 10%"
            risk_level: "low"
        mapped_rules: ["HKIPO-005"]

      - id: "F006"
        name: "EBITDA利润率"
        name_en: "ebitda_margin"
        source_sections: ["综合损益表附注", "管理层讨论与分析"]
        source_keywords: ["EBITDA", "息税折旧摊销前利润", "ebitda margin"]
        calculation: "EBITDA / 营业收入 × 100%"
        data_type: "float"
        unit: "percent"
        thresholds:
          - condition: "|EBITDA利润率 - 行业中位数| > 15个百分点"
            risk_level: "high"
          - condition: "|偏差| 10-15个百分点"
            risk_level: "medium"
          - condition: "|偏差| < 10个百分点"
            risk_level: "low"
        mapped_rules: ["HKIPO-006"]

      - id: "F007"
        name: "每股收益(EPS)趋势"
        name_en: "eps_trend"
        source_sections: ["综合损益表", "财务摘要"]
        source_keywords: ["每股收益", "EPS", "earnings per share"]
        calculation: "归母净利润 / 加权平均普通股股数；统计连续期间变化方向"
        data_type: "float"
        unit: "currency"
        thresholds:
          - condition: "EPS < 0"
            risk_level: "high"
          - condition: "EPS连续3期下降"
            risk_level: "high"
          - condition: "EPS连续2期下降"
            risk_level: "medium"
          - condition: "EPS稳定或上升"
            risk_level: "low"
        mapped_rules: ["HKIPO-008"]

      # --- Solvency ---
      - id: "F008"
        name: "流动比率"
        name_en: "current_ratio"
        source_sections: ["资产负债表", "财务资料"]
        source_keywords: ["流动比率", "current ratio", "流动资产", "流动负债"]
        calculation: "流动资产 / 流动负债"
        data_type: "float"
        unit: "ratio"
        thresholds:
          - condition: "< 0.7"
            risk_level: "high"
          - condition: "0.7 - 1.0"
            risk_level: "medium"
          - condition: "1.0 - 2.0"
            risk_level: "low"
          - condition: "> 2.0"
            risk_level: "low"
            note: "过高可能暗示资产利用效率低"
        mapped_rules: ["HKIPO-009"]

      - id: "F009"
        name: "速动比率"
        name_en: "quick_ratio"
        source_sections: ["资产负债表", "财务资料"]
        source_keywords: ["速动比率", "quick ratio", "速动资产"]
        calculation: "(流动资产 - 存货) / 流动负债"
        data_type: "float"
        unit: "ratio"
        thresholds:
          - condition: "< 0.5"
            risk_level: "high"
          - condition: "0.5 - 0.7"
            risk_level: "medium"
          - condition: "0.7 - 1.5"
            risk_level: "low"
          - condition: "> 1.5"
            risk_level: "low"
        mapped_rules: ["HKIPO-010"]

      - id: "F010"
        name: "资产负债率"
        name_en: "debt_to_asset_ratio"
        source_sections: ["资产负债表", "财务资料"]
        source_keywords: ["资产负债率", "leverage", "总负债", "总资产"]
        calculation: "总负债 / 总资产 × 100%"
        data_type: "float"
        unit: "percent"
        thresholds:
          - condition: "> 80%"
            risk_level: "high"
          - condition: "70% - 80%"
            risk_level: "high"
          - condition: "50% - 70%"
            risk_level: "medium"
          - condition: "< 50%"
            risk_level: "low"
        mapped_rules: ["HKIPO-011", "HKIPO-013", "HKIPO-014", "HKIPO-045"]

      - id: "F011"
        name: "利息保障倍数"
        name_en: "interest_coverage_ratio"
        source_sections: ["综合损益表", "附注", "财务资料"]
        source_keywords: ["利息保障倍数", "interest coverage", "EBIT", "利息费用"]
        calculation: "EBIT / 利息费用"
        data_type: "float"
        unit: "ratio"
        thresholds:
          - condition: "< 1.5"
            risk_level: "high"
          - condition: "1.5 - 2.0"
            risk_level: "medium"
          - condition: "2.0 - 5.0"
            risk_level: "low"
          - condition: "> 5.0"
            risk_level: "low"
        mapped_rules: ["HKIPO-012"]

      - id: "F012"
        name: "现金短债比"
        name_en: "cash_to_short_term_debt_ratio"
        source_sections: ["资产负债表", "财务资料"]
        source_keywords: ["现金短债比", "货币资金", "短期借款"]
        calculation: "(货币资金 + 交易性金融资产) / 短期借款"
        data_type: "float"
        unit: "ratio"
        thresholds:
          - condition: "< 0.3"
            risk_level: "high"
          - condition: "0.3 - 0.5"
            risk_level: "high"
          - condition: "0.5 - 1.0"
            risk_level: "medium"
          - condition: "> 1.0"
            risk_level: "low"
        mapped_rules: ["HKIPO-015", "HKIPO-016", "HKIPO-014"]

      # --- Cash Flow ---
      - id: "F013"
        name: "经营活动现金流净额"
        name_en: "operating_cash_flow"
        source_sections: ["现金流量表", "财务资料"]
        source_keywords: ["经营活动现金流", "operating cash flow", "经营性现金流净额"]
        calculation: "直接从现金流量表读取；判断连续期间正负及趋势"
        data_type: "float"
        unit: "currency"
        thresholds:
          - condition: "< 0 且连续2期以上"
            risk_level: "high"
          - condition: "< 0"
            risk_level: "high"
          - condition: "> 0 但低于净利润"
            risk_level: "medium"
          - condition: "> 0 且 ≥ 净利润"
            risk_level: "low"
        mapped_rules: ["HKIPO-024", "HKIPO-025", "HKIPO-028", "HKIPO-029"]

      - id: "F014"
        name: "自由现金流(FCF)"
        name_en: "free_cash_flow"
        source_sections: ["现金流量表", "财务资料"]
        source_keywords: ["自由现金流", "free cash flow", "FCF", "资本性支出"]
        calculation: "经营性现金流净额 - 资本性支出"
        data_type: "float"
        unit: "currency"
        thresholds:
          - condition: "< 0 且连续3期以上"
            risk_level: "high"
          - condition: "< 0"
            risk_level: "medium"
          - condition: "> 0"
            risk_level: "low"
        mapped_rules: ["HKIPO-026", "HKIPO-027", "HKIPO-028"]

      - id: "F015"
        name: "现金消耗率(Burn Rate)"
        name_en: "cash_burn_rate"
        source_sections: ["现金流量表", "管理层讨论与分析"]
        source_keywords: ["现金消耗率", "burn rate", "现金跑道", "cash runway"]
        calculation: "月度现金消耗率 = |经营性现金流净额| / 12；现金跑道 = (现金+短期投资) / 月度消耗率"
        data_type: "float"
        unit: "months"
        thresholds:
          - condition: "现金跑道 < 6个月"
            risk_level: "high"
          - condition: "6 - 12个月"
            risk_level: "high"
          - condition: "12 - 24个月"
            risk_level: "medium"
          - condition: "> 24个月"
            risk_level: "low"
        mapped_rules: ["HKIPO-030"]

      - id: "F016"
        name: "现金流利润比"
        name_en: "cash_flow_to_profit_ratio"
        source_sections: ["现金流量表", "综合损益表", "财务资料"]
        source_keywords: ["现金流利润比", "盈余质量", "accrual ratio"]
        calculation: "经营活动现金流净额 / 净利润"
        data_type: "float"
        unit: "ratio"
        thresholds:
          - condition: "< 0.3 且连续2期"
            risk_level: "high"
          - condition: "0.3 - 0.5"
            risk_level: "medium"
          - condition: "0.5 - 1.2"
            risk_level: "low"
          - condition: "> 1.2"
            risk_level: "low"
            note: "过高可能有一次性因素"
        mapped_rules: ["HKIPO-025"]

      # --- Quality ---
      - id: "F017"
        name: "非经常性损益占比"
        name_en: "non_recurring_pnl_ratio"
        source_sections: ["综合损益表附注", "财务资料"]
        source_keywords: ["非经常性损益", "non-recurring", "一次性收益"]
        calculation: "|非经常性损益| / |净利润| × 100%"
        data_type: "float"
        unit: "percent"
        thresholds:
          - condition: "> 80%"
            risk_level: "high"
          - condition: "50% - 80%"
            risk_level: "high"
          - condition: "30% - 50%"
            risk_level: "medium"
          - condition: "< 30%"
            risk_level: "low"
        mapped_rules: ["HKIPO-007", "HKIPO-031", "HKIPO-033", "HKIPO-034", "HKIPO-035"]

      - id: "F018"
        name: "政府补贴依赖度"
        name_en: "government_subsidy_dependency"
        source_sections: ["综合损益表附注", "其他收入明细"]
        source_keywords: ["政府补贴", "government grant", "政府补助", "财政补贴"]
        calculation: "政府补贴收入 / 净利润 × 100%"
        data_type: "float"
        unit: "percent"
        thresholds:
          - condition: "> 50%"
            risk_level: "high"
          - condition: "30% - 50%"
            risk_level: "high"
          - condition: "15% - 30%"
            risk_level: "medium"
          - condition: "< 15%"
            risk_level: "low"
        mapped_rules: ["HKIPO-032"]

      - id: "F019"
        name: "研发资本化率"
        name_en: "rd_capitalization_rate"
        source_sections: ["综合损益表附注", "无形资产附注"]
        source_keywords: ["资本化率", "capitalization rate", "研发支出", "开发支出"]
        calculation: "资本化研发支出 / 研发总投入 × 100%"
        data_type: "float"
        unit: "percent"
        thresholds:
          - condition: "> 50%"
            risk_level: "high"
          - condition: "> 行业均值×1.5"
            risk_level: "high"
          - condition: "30% - 50%"
            risk_level: "medium"
          - condition: "< 30%"
            risk_level: "low"
        mapped_rules: ["HKIPO-036"]

      # --- Growth ---
      - id: "F020"
        name: "营业收入增长率"
        name_en: "revenue_growth_rate"
        source_sections: ["综合损益表", "管理层讨论与分析"]
        source_keywords: ["营收增长", "revenue growth", "营业收入同比"]
        calculation: "(本期营收 - 上期营收) / |上期营收| × 100%"
        data_type: "float"
        unit: "percent"
        thresholds:
          - condition: "< 0% 或连续3期递减"
            risk_level: "high"
          - condition: "0% - 10%"
            risk_level: "medium"
          - condition: "10% - 30%"
            risk_level: "low"
          - condition: "> 30%"
            risk_level: "low"
            note: "需验证可持续性"
        mapped_rules: ["HKIPO-038", "HKIPO-039", "HKIPO-040", "HKIPO-041", "HKIPO-042", "HKIPO-043"]

  # ============================================================
  # Group 2: Non-Standard Features (15 features)
  # ============================================================
  - id: "FG_NON_STANDARD"
    name: "非标特征组"
    description: "从招股书定性披露中提取的非标风险特征，覆盖客户/供应商依赖、关联交易、对赌条款、诉讼、VIE架构、IPO结构等"
    features:
      - id: "F021"
        name: "前五大客户集中度"
        name_en: "top5_customer_concentration"
        source_sections: ["业务章节", "主要客户"]
        source_keywords: ["客户集中度", "前五大客户", "top customer", "主要客户"]
        calculation: "前五大客户合计收入 / 总收入 × 100%；同时记录单一最大客户占比"
        data_type: "float"
        unit: "percent"
        thresholds:
          - condition: "> 70% 或单一客户 > 30%"
            risk_level: "high"
          - condition: "50% - 70%"
            risk_level: "high"
          - condition: "30% - 50%"
            risk_level: "medium"
          - condition: "< 30%"
            risk_level: "low"
        mapped_rules: ["HKIPO-049", "HKIPO-052", "HKIPO-082"]

      - id: "F022"
        name: "前五大供应商集中度"
        name_en: "top5_supplier_concentration"
        source_sections: ["业务章节", "主要供应商"]
        source_keywords: ["供应商集中度", "前五大供应商", "top supplier", "主要供应商"]
        calculation: "前五大供应商合计采购额 / 总采购额 × 100%"
        data_type: "float"
        unit: "percent"
        thresholds:
          - condition: "> 70% 或单一供应商 > 30%"
            risk_level: "high"
          - condition: "50% - 70%"
            risk_level: "high"
          - condition: "30% - 50%"
            risk_level: "medium"
          - condition: "< 30%"
            risk_level: "low"
        mapped_rules: ["HKIPO-050"]

      - id: "F023"
        name: "客户供应商重叠度"
        name_en: "customer_supplier_overlap"
        source_sections: ["业务章节", "主要客户及供应商"]
        source_keywords: ["客户与供应商重叠", "既是客户又是供应商", "overlap"]
        calculation: "同时位列前五大客户和前五大供应商的实体数量"
        data_type: "integer"
        unit: "count"
        thresholds:
          - condition: "≥ 3个重叠实体"
            risk_level: "high"
          - condition: "1-2个重叠实体"
            risk_level: "high"
          - condition: "0个"
            risk_level: "low"
        mapped_rules: ["HKIPO-051", "HKIPO-053"]

      - id: "F024"
        name: "关联交易占比"
        name_en: "connected_transaction_ratio"
        source_sections: ["关联交易章节", "与关联人士的交易"]
        source_keywords: ["关联交易", "connected transaction", "关联方", "关连交易"]
        calculation: "关联交易收入 / 总收入 × 100%；关联采购 / 总采购 × 100%；取较高值"
        data_type: "float"
        unit: "percent"
        thresholds:
          - condition: "> 30%"
            risk_level: "high"
          - condition: "15% - 30%"
            risk_level: "high"
          - condition: "5% - 15%"
            risk_level: "medium"
          - condition: "< 5%"
            risk_level: "low"
        mapped_rules: ["HKIPO-054", "HKIPO-055", "HKIPO-056", "HKIPO-057", "HKIPO-058", "HKIPO-059"]

      - id: "F025"
        name: "特殊股东条款数量"
        name_en: "special_shareholder_rights_count"
        source_sections: ["历史与发展", "过往重大投资", "与控股股东关系"]
        source_keywords: ["对赌", "赎回", "反稀释", "一票否决", "优先清算", "bet-on", "VAM"]
        calculation: "统计招股书中披露的对赌协议、估值调整机制、强制回购条款及特殊股东优先权条款数量"
        data_type: "integer"
        unit: "count"
        thresholds:
          - condition: "≥ 4项特殊条款"
            risk_level: "high"
          - condition: "2-3项"
            risk_level: "medium"
          - condition: "1项"
            risk_level: "medium"
          - condition: "0项"
            risk_level: "low"
        mapped_rules: ["HKIPO-060", "HKIPO-061", "HKIPO-062", "HKIPO-063", "HKIPO-064"]

      - id: "F026"
        name: "未决诉讼风险敞口"
        name_en: "pending_litigation_exposure"
        source_sections: ["法律诉讼", "风险因素", "或有事项"]
        source_keywords: ["诉讼", "litigation", "未决诉讼", "仲裁", "纠纷"]
        calculation: "公司为被告的未决诉讼涉案金额合计 / 归母净资产 × 100%；同时统计案件数量"
        data_type: "float"
        unit: "percent"
        thresholds:
          - condition: "> 30% 或涉及核心技术诉讼"
            risk_level: "high"
          - condition: "10% - 30%"
            risk_level: "high"
          - condition: "5% - 10%"
            risk_level: "medium"
          - condition: "< 5%"
            risk_level: "low"
        mapped_rules: ["HKIPO-072", "HKIPO-073", "HKIPO-074", "HKIPO-075", "HKIPO-076"]

      - id: "F027"
        name: "VIE架构存在性与复杂度"
        name_en: "vie_structure_presence"
        source_sections: ["合约安排", "监管概览", "风险因素"]
        source_keywords: ["VIE", "可变利益实体", "合约安排", "协议控制"]
        calculation: "布尔值：是否存在VIE架构；若存在，统计VIE实体数量和所涉业务线数"
        data_type: "boolean"
        unit: "flag"
        thresholds:
          - condition: "存在VIE且主营在负面清单内"
            risk_level: "high"
          - condition: "存在VIE但不在负面清单"
            risk_level: "medium"
          - condition: "不存在VIE"
            risk_level: "low"
        mapped_rules: ["HKIPO-067"]

      - id: "F028"
        name: "大股东股权质押比例"
        name_en: "controlling_shareholder_pledge_ratio"
        source_sections: ["股本及股东资料", "与控股股东关系"]
        source_keywords: ["股权质押", "pledge", "质押", "控股股东"]
        calculation: "控股股东已质押股份数 / 控股股东总持股数 × 100%"
        data_type: "float"
        unit: "percent"
        thresholds:
          - condition: "> 80%"
            risk_level: "high"
          - condition: "50% - 80%"
            risk_level: "high"
          - condition: "20% - 50%"
            risk_level: "medium"
          - condition: "< 20%"
            risk_level: "low"
        mapped_rules: ["HKIPO-077", "HKIPO-078", "HKIPO-079"]

      - id: "F029"
        name: "受限制资产比例"
        name_en: "restricted_assets_ratio"
