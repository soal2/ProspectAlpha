pdf_processor:
  default: mineru
  mineru:
    method: ocr
    backend: pipeline
    lang: chinese_cht
    # auto / cpu / mps / cuda / cuda:<index>; MINERU_DEVICE overrides this value.
    device: auto
    reuse_existing: true
    image_analysis: true

chunker:
  default: block
  block:
    max_chars: 1200
    include_types:
      - text
      - table
      - image
    skip_types:
      - header
      - footer
      - page_number
    merge_text: true
    require_image_description: true
    image_context_window_blocks: 3
