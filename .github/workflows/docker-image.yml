name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run backend tests
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # The image build below installs the full MinerU/torch stack. Tests only
          # need the importable package surface, so keep this step off the CUDA wheels
          # or the runner runs out of disk and the image build is killed.
          python -m pip install -e ".[dev]" "pdfplumber>=0.11.0" "psycopg[binary]>=3.2.0"
          python -m pip install --no-deps mineru
          pytest
      - name: Build the Docker image
        run: docker build ./backend --file ./backend/Dockerfile --tag prospectalpha-backend:${{ github.sha }}
